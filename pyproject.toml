[project]
name = "aisearch-sharepoint-indexer"
version = "0.1.0"
description = "Create a SharePoint data source, multimodal index, skillset and indexer."
requires-python = ">=3.11"
dependencies = [
    "azure-identity>=1.25,<2",
    "httpx>=0.28,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.18,<1.19",
    "pytest>=8.4,<10",
    "ruff>=0.14,<1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
